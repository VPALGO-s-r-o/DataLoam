name: Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Title format:** `[Feature]: <what you want to be able to do>`
        - ✅ `[Feature]: Save and reuse query snippets per connection`
        - ✅ `[Feature]: Support ClickHouse`
        - ❌ `[Feature]: improvement`

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or pain point, not just the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like DataLoam to handle this?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What do you do today, or what other tools do well here?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connections
        - Database explorer
        - Query editor
        - Autocomplete
        - Query results
        - Export
        - SQL formatting
        - AI assistant
        - New database support
        - Other
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      multiple: true
      options:
        - PostgreSQL
        - MySQL
        - Microsoft SQL Server
        - SQLite
        - MongoDB
        - Other (describe above)
        - Not database-specific

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been requested yet.
          required: true
